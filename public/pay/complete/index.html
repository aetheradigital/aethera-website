<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment status — Aethera Digital</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,200;0,300;0,400;0,600;1,300&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="/assets/pay.css">
<script src="https://js.stripe.com/endive/stripe.js"></script>
<style>
.stage{display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:640px}
.card h1{font-size:clamp(40px,6vw,60px);margin-top:18px}
.card p.body{color:#D6D6DC;margin:18px 0 0}
.icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000}
.icon svg{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .8s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
dl{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;margin:28px 0 0;padding:20px 0 0;border-top:1px solid var(--line);font-size:16px}
dt{color:var(--mute)}dd{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
@media (prefers-reduced-motion:reduce){.icon svg{stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="topbar"><a class="logo" href="/" aria-label="Aethera Digital home"><img src="/assets/icon.png" alt="" width="34" height="34"></a><a class="back" href="/pay/">Client payments</a></header>
<main class="stage">
<div class="orb" style="background: #C8B6FF; left: 10%; top: 0" aria-hidden="true"></div>
<div class="orb" style="background: #FFC4A8; right: 5%; bottom: 0" aria-hidden="true"></div>

<section class="card" id="loading" aria-live="polite">
<p class="eyebrow">Client payments</p>
<h1>Confirming your payment…</h1>
<div class="dots" style="margin-top: 28px" aria-hidden="true"><span></span><span></span><span></span></div>
</section>

<section class="card" id="result" hidden aria-live="polite">
<div class="icon" id="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="icon-path" d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
<h1 id="title"></h1>
<p class="body" id="body"></p>
<dl id="details" hidden></dl>
<div class="btns" id="btns"></div>
</section>
</main>
<script src="/assets/pay.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var secret = qs.get('payment_intent_client_secret');
  var kind = qs.get('kind') === 'partnership' ? 'partnership' : 'invoice';
  var i = qs.get('i'), k = qs.get('k');
  var invoiceUrl = i && k ? '/pay/invoice/?i=' + encodeURIComponent(i) + '&k=' + encodeURIComponent(k) : null;
  var $ = function (id) { return document.getElementById(id); };

  function btn(href, label, ghost) { var a = document.createElement('a'); a.className = 'pill' + (ghost ? ' ghost' : ''); a.href = href; a.textContent = label; $('btns').appendChild(a); }
  function row(k2, v) { if (!v) return; var dl = $('details'); dl.hidden = false; var dt = document.createElement('dt'); dt.textContent = k2; var dd = document.createElement('dd'); dd.textContent = v; dl.appendChild(dt); dl.appendChild(dd); }
  function result(state, title, body) {
    var colors = { ok: '#C8B6FF', wait: '#AFCBFF', bad: '#FFB3B3' };
    $('icon').style.background = colors[state];
    if (state === 'bad') $('icon-path').setAttribute('d', 'M7 7l10 10M17 7L7 17');
    if (state === 'wait') $('icon-path').setAttribute('d', 'M12 7v5l3 3');
    $('title').innerHTML = title; $('body').textContent = body;
    $('loading').hidden = true; $('result').hidden = false;
  }
  function failed() {
    result('bad', 'Payment <em>not completed.</em>', 'Your payment didn’t go through and you haven’t been charged. You can try again, or email hello@aetheradigital.com and we’ll help.');
    btn(invoiceUrl || '/pay/', 'Try again'); btn('mailto:hello@aetheradigital.com', 'Email us', true);
  }

  if (!secret) { failed(); return; }
  AetheraPay.config().then(function (cfg) {
    if (!cfg.enabled || !window.Stripe) throw new Error('unavailable');
    return window.Stripe(cfg.publishableKey).retrievePaymentIntent(secret);
  }).then(function (r) {
    var pi = r && r.paymentIntent;
    if (!pi) return failed();
    var amount = AetheraPay.money(pi.amount, pi.currency);
    if (pi.status === 'succeeded' || pi.status === 'processing') {
      var processing = pi.status === 'processing';
      if (kind === 'partnership') {
        result(processing ? 'wait' : 'ok', processing ? 'You’re in. <em>Payment clearing.</em>' : 'Welcome aboard. <em>Let’s build.</em>',
          processing ? 'Your Startup Partnership is set up. Bank payments take 3–5 business days to clear; we’ll email your receipt once it does, and reach out within one business day to schedule kickoff.'
                     : 'Your Startup Partnership is active. Your receipt is on its way, and we’ll reach out within one business day to schedule kickoff.');
        row('Plan', 'Startup Partnership, month-to-month'); row('Monthly', amount);
      } else {
        result(processing ? 'wait' : 'ok', processing ? 'Payment <em>processing.</em>' : 'Thank you. <em>You’re all set.</em>',
          processing ? 'Your bank payment is on its way and usually clears in 3–5 business days. We’ll email your receipt when it does.'
                     : 'Your payment went through. A receipt is on its way to your inbox.');
        row('Amount', amount);
        if (i && k) fetch('/api/invoice?i=' + encodeURIComponent(i) + '&k=' + encodeURIComponent(k)).then(function (x) { return x.json(); }).then(function (inv) { if (inv && inv.number) row('Invoice', inv.number); }).catch(function () {});
      }
      btn('/', 'Back to home');
      if (kind === 'invoice' && invoiceUrl) btn(invoiceUrl, 'View invoice', true);
      return;
    }
    failed();
  }).catch(failed);
})();
</script>
</body>
</html>
