<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethera Desk</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,200;0,300;0,400;0,600;1,300&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="/assets/pay.css?v=4">
<link rel="stylesheet" href="/assets/desk.css?v=3">
</head>
<body>

<div class="login-wrap" id="login" hidden>
<div class="orb" style="background: #C8B6FF; left: 10%; top: 5%" aria-hidden="true"></div>
<section class="card login">
<img src="/assets/icon.png" alt="" width="40" height="40">
<p class="eyebrow" style="margin-top: 22px">Aethera Desk</p>
<h1>Sign <em>in.</em></h1>
<form id="login-form" novalidate>
<div class="fld"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
<p class="err" id="login-err" role="alert" hidden></p>
<button class="pill block" type="submit">Sign in</button>
</form>
</section>
</div>

<div class="desk" id="app" hidden>
<aside class="side" aria-label="Desk navigation">
<a class="brand" href="#/"><img src="/assets/icon.png" alt="" width="32" height="32"><span><b>Aethera</b><small>Desk</small></span></a>
<nav class="nav" aria-label="Sections">
<a href="#/" data-nav="overview"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>Overview</a>
<a href="#/clients" data-nav="clients"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="7" r="3.2"/><path d="M3.5 17c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/></svg>Clients</a>
<a href="#/projects" data-nav="projects"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="4" height="14" rx="1.2"/><rect x="8.5" y="3" width="4" height="9" rx="1.2"/><rect x="14" y="3" width="3" height="11" rx="1.2"/></svg>Projects</a>
<a href="#/approvals" data-nav="approvals"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10.5l3.5 3.5L16 5.5"/></svg>Approvals</a>
<a href="#/reports" data-nav="reports"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 16.5h14M5.5 13V9M10 13V5M14.5 13v-6"/></svg>Reports</a>
<a href="#/invoices" data-nav="invoices"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="2.5" width="12" height="15" rx="2"/><path d="M7 7h6M7 10.5h6M7 14h3.5"/></svg>Invoices</a>
</nav>
<div class="foot"><span class="mode" id="mode" hidden></span><button type="button" id="logout">Sign out</button></div>
</aside>
<main class="main" id="main" tabindex="-1"></main>
</div>

<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/desk.js?v=3"></script>
</body>
</html>
